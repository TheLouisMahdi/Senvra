name: Apply Base64 patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_base64_patch.py"
      - ".github/workflows/apply-base64-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/apply_base64_patch.py

      - name: Check JavaScript syntax and page structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>(.*?)</script>', s, re.S)
          if not script:
              raise SystemExit('inline script not found')
          Path('/tmp/senvra.js').write_text(script.group(1), encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', s)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              raise SystemExit(f'duplicate ids: {duplicates}')
          PY
          node --check /tmp/senvra.js

      - name: Commit updated application
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Base64 developer output"
          git push
