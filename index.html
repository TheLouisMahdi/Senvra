  helper.style.left = "-9999px";
  helper.style.width = "1px";
  helper.style.height = "1px";
  helper.style.opacity = "0";
  helper.style.pointerEvents = "none";
  document.body.appendChild(helper);
  try {
    helper.focus();
    helper.select();
    helper.setSelectionRange(0, helper.value.length);
    if (!document.execCommand("copy")) throw new Error(uiText("کپی توسط مرورگر انجام نشد.", "The browser did not allow copying."));
  } finally {
    helper.remove();
  }
}

dom.passwordToggle.addEventListener("change", () => { dom.passwordDrawer.classList.toggle("open", dom.passwordToggle.checked); dom.encryptionApplied.classList.remove("show"); });
dom.generatePassword.addEventListener("click", () => { dom.passwordInput.value = generateP2Key(); setStatus(dom.encodeStatus, state.language === "fa" ? "رمز تصادفی ساخته شد؛ آن را جداگانه نگه دار." : "Random password created; keep it separately.", "good"); });
dom.copyPassword.addEventListener("click", async () => { if (!parseP2Key(dom.passwordInput.value)) { setStatus(dom.encodeStatus, uiText("اول رمز وارد کن یا Random Pass بزن.", "Enter a password or use Random Pass first."), "warn"); return; } try { await copyTextToClipboard(dom.passwordInput.value.trim()); setStatus(dom.encodeStatus, state.language === "fa" ? "رمز در Clipboard کپی شد." : "Password copied to the clipboard.", "good"); } catch (e) { setStatus(dom.encodeStatus, String(e?.message || e), "warn"); } });
dom.fileInput.addEventListener("change", () => { const f = dom.fileInput.files?.[0]; if (f) encodeFile(f); });
for (const evt of ["dragenter","dragover"]) dom.dropZone.addEventListener(evt, e => { e.preventDefault(); dom.dropZone.classList.add("drag"); });
for (const evt of ["dragleave","drop"]) dom.dropZone.addEventListener(evt, e => { e.preventDefault(); dom.dropZone.classList.remove("drag"); });
dom.dropZone.addEventListener("drop", e => { const f = e.dataTransfer?.files?.[0]; if (f) encodeFile(f); });
dom.copyCode.addEventListener("click", async () => { try { const text = ensureTextCache(); await copyTextToClipboard(text); setStatus(dom.encodeStatus, state.language === "fa" ? "متن در Clipboard کپی شد." : "Text copied to the clipboard.", "good"); } catch (e) { setStatus(dom.encodeStatus, String(e?.message || e), "warn"); } });
dom.downloadPoimu.addEventListener("click", () => { if (!state.senvraBlob) return; downloadBlob(state.senvraBlob, state.outputBaseName + ".senvra"); });
dom.startLargeEncode.addEventListener("click", () => { try { const text = ensureTextCache(); downloadBlob(new Blob([text], { type: "text/plain;charset=utf-8" }), state.outputBaseName + ".txt"); } catch (e) { setStatus(dom.encodeStatus, String(e?.message || e), "bad"); } });
dom.downloadZip.addEventListener("click", () => { if (!state.zipBlob) return; downloadBlob(state.zipBlob, state.outputBaseName + ".zip"); });
dom.copyBase64.addEventListener("click", async () => { try { await copyOriginalBase64(); } catch (e) { setStatus(dom.encodeStatus, String(e?.message || e), "warn"); } });
dom.loadPoimu.addEventListener("click", () => dom.poimuInput.click());
dom.poimuInput.addEventListener("change", () => { const f = dom.poimuInput.files?.[0]; if (f) loadInputFile(f); });
dom.pasteButton.addEventListener("click", async () => { try { wipeBytes(state.loadedContainer); state.loadedContainer = null; dom.decodeInput.style.display = "block"; dom.largeDecodePlaceholder.classList.remove("show"); dom.decodeInput.value = await navigator.clipboard.readText(); setStatus(dom.decodeStatus, state.language === "fa" ? "متن وارد شد." : "Text pasted.", "good"); } catch { setStatus(dom.decodeStatus, state.language === "fa" ? "Paste خودکار ممکن نیست؛ دستی Paste کن." : "Automatic paste is not available; paste it manually.", "warn"); } });
dom.pastePassword.addEventListener("click", async () => { try { dom.decodePasswordInput.value = await navigator.clipboard.readText(); } catch { setStatus(dom.decodeStatus, uiText("Paste خودکار ممکن نیست.", "Automatic paste is not available."), "warn"); } });
dom.clearPassword.addEventListener("click", () => { dom.decodePasswordInput.value = ""; });
dom.restoreButton.addEventListener("click", restoreCurrent); dom.clearButton.addEventListener("click", clearDecode);
dom.downloadFile.addEventListener("click", () => { if (!state.restoredBytes) return; downloadBlob(new Blob([state.restoredBytes], { type: state.restoredMime }), state.restoredName); });
window.addEventListener("pagehide", () => { wipeEncodeState(); wipeDecodeState(); dom.passwordInput.value = ""; dom.decodePasswordInput.value = ""; });

updateLanguage("fa"); resetEncodeUi(); resetDecodeUi(); setStatus(dom.encodeStatus, ""); setStatus(dom.decodeStatus, "");
</script>
